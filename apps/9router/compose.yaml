services:
  9router:
    image: decolua/9router:latest

    container_name: 9router

    restart: unless-stopped

    ports:
      - "20128:20128"

    env_file:
      - .env

    environment:
      DATA_DIR: /app/data

    volumes:
      - /opt/x-misz-os/data/9router:/app/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:20128/ || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
